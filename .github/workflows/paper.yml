name: paper
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore state (branch paper, single orphan commit)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          mkdir -p paper
          if git ls-remote --exit-code --heads origin paper >/dev/null 2>&1; then
            git fetch -q --depth 1 origin paper && git --work-tree=paper checkout FETCH_HEAD -- . 
          fi
      - name: Live paper test (27 minutes)
        run: python -m pipeline.paper_cli --state paper/state.json --minutes 27
      - name: Save (force-push one orphan commit so history never grows)
        run: |
          cd paper
          git init -q -b paper
          git config user.name "confluence-paper"; git config user.email "actions@users.noreply.github.com"
          git add -A; git commit -q -m "paper state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" paper
