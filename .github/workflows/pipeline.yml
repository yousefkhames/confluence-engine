name: pipeline
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - run: python -m unittest discover -s tests
      - name: Restore data branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q "$URL" data-branch
          cd data-branch
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch -q --depth 1 origin data && git checkout -q -B data FETCH_HEAD
          else
            git checkout -q --orphan data
            git rm -rq -f . || true
          fi
          mkdir -p data
      - name: Collect, learn, build
        run: python -m pipeline.run --data data-branch/data --site site
      - name: Save data
        run: |
          cd data-branch
          date -u +%FT%TZ > data/heartbeat.txt
          git config user.name "confluence-pipeline"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)" || true
          git push -q origin HEAD:data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
